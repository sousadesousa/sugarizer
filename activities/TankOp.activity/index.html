<!doctype html>
<html>

<head>
  <script src="lib/sugar-web/activity/toolbarmode.js"></script>
	<meta charset="utf-8" />
	<title>Tank Operation Activity</title>
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"/>
	<link rel="stylesheet" media="not screen and (device-width: 1200px) and (device-height: 900px)"
		  href="lib/sugar-web/graphics/css/sugar-96dpi.css">
	<link rel="stylesheet" media="screen and (device-width: 1200px) and (device-height: 900px)"
		  href="lib/sugar-web/graphics/css/sugar-200dpi.css">
	<link rel="stylesheet" href="css/activity.css">
	<link rel="stylesheet" href="css/introjs.css">
	<link rel="stylesheet" href="css/styles.css">
	<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
	<script src="lib/vue.global.prod.js"></script>
	<script src="lib/intro.js"></script>
	<script>if (window.module) module = window.module;</script>
	<script src="lib/require.js"></script>
	<script type="text/javascript" src="../../cordova.js"></script><!-- HACK: need only on Android -->
</head>
<body class="body">
	<div id="app">
		<sugar-toolbar ref="SugarToolbar">
			<sugar-toolitem id="activity-button" title="Tank Operation" data-toolbar="advanced"></sugar-toolitem>
			<p class="title">TANK OPERATION</p>
			<sugar-toolitem id="stop-button" title="Stop" class="pull-right" @click="onStop"></sugar-toolitem>
			<sugar-toolitem id="fullscreen-button" title="Fullscreen" class="pull-right" data-toolbar="advanced" @click="setFullscreen(true)"></sugar-toolitem>
			<sugar-toolitem id="help-button" title="Tutorial" class="pull-right" data-toolbar="advanced" @click="onHelp"></sugar-toolitem>
		</sugar-toolbar>

		<div id="board">
			<tankop-home v-if="screen == 'home'" :strings="strings" @play="play"></tankop-home>
			<tankop-play v-else :level="level" :strings="strings" @home="goHome"></tankop-play>
		</div>

		<button class="toolbutton pull-right" id="unfullscreen-button" title="UnFullscreen" data-toolbar="advanced" :style="{visibility: state.fullscreen ? 'visible' : 'hidden', top: state.fullscreen ? '60px' : ''}" @click="setFullscreen(false)"></button>

		<sugar-activity ref="SugarActivity" @initialized="onInitialized"></sugar-activity>
		<sugar-localization ref="SugarL10n"></sugar-localization>
		<sugar-popup ref="SugarPopup"></sugar-popup>
		<sugar-tutorial ref="SugarTutorial"></sugar-tutorial>
	</div>

	<script src="js/components/SugarActivity.js"></script>
	<script src="js/components/SugarToolbar.js"></script>
	<script src="js/components/SugarL10n.js"></script>
	<script src="js/components/SugarPopup.js"></script>
	<script src="js/components/SugarTutorial.js"></script>
	<script src="js/tankop.js"></script>
	<script src="js/components/TankOpParts.js"></script>
	<script src="js/tutorial.js"></script>
	<script src="js/activity.js"></script>
</body>
</html>
