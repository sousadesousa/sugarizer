<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Food Chain Activity</title>
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"/>
	<link rel="stylesheet" media="not screen and (device-width: 1200px) and (device-height: 900px)" href="lib/sugar-web/graphics/css/sugar-96dpi.css">
	<link rel="stylesheet" media="screen and (device-width: 1200px) and (device-height: 900px)" href="lib/sugar-web/graphics/css/sugar-200dpi.css">
	<link rel="stylesheet" href="css/activity.css">
	<link rel="stylesheet" href="css/introjs.css">
	<link rel="stylesheet" href="styles.css">
	<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
	<script src="lib/vue.global.prod.js"></script>
	<script src="lib/intro.js"></script>
	<script>if (window.module) module = window.module;</script>
	<script src="lib/require.js"></script>
	<script type="text/javascript" src="../../cordova.js"></script><!-- HACK: need only on Android -->
</head>
<body>
	<div id="app">
		<sugar-toolbar ref="SugarToolbar">
			<sugar-toolitem id="activity-button" title="FoodChain Activity"></sugar-toolitem>
			<sugar-toolitem id="en-button" title="English" :active="state.lang == 'en'" @click="setLanguage('en')"></sugar-toolitem>
			<sugar-toolitem id="fr-button" title="Français" :active="state.lang == 'fr'" @click="setLanguage('fr')"></sugar-toolitem>
			<sugar-toolitem id="pt_BR-button" title="Português" :active="state.lang == 'pt_BR'" @click="setLanguage('pt_BR')"></sugar-toolitem>
			<sugar-toolitem id="stop-button" title="Stop" class="pull-right" @click="onStop"></sugar-toolitem>
			<sugar-toolitem id="fullscreen-button" title="Fullscreen" class="pull-right" @click="setFullscreen(true)"></sugar-toolitem>
			<sugar-toolitem id="help-button" title="Tutorial" class="pull-right" @click="onHelp"></sugar-toolitem>
		</sugar-toolbar>

		<!-- The content of the activity goes inside the canvas -->
		<div id="canvas" class="board" :style="{top: state.fullscreen ? '0px' : ''}">
			<div id="body">
				<fc-home v-if="screen == 'home'" @play="playGame" @credits="screen = 'credits'"></fc-home>
				<fc-credits v-else-if="screen == 'credits'" @home="goHome"></fc-credits>
				<fc-learn v-else-if="screen == 'LearnGame'" :start-level="level" @home="goHome"></fc-learn>
				<fc-build v-else-if="screen == 'BuildGame'" :start-level="level" @home="goHome"></fc-build>
				<fc-play v-else-if="screen == 'PlayGame'" :start-level="level" @home="goHome"></fc-play>
			</div>
		</div>
		<button class="toolbutton pull-right" id="unfullscreen-button" title="Unfullscreen" :style="{visibility: state.fullscreen ? 'visible' : 'hidden'}" @click="setFullscreen(false)"></button>

		<sugar-activity ref="SugarActivity" @initialized="onInitialized"></sugar-activity>
		<sugar-localization ref="SugarL10n"></sugar-localization>
		<sugar-popup ref="SugarPopup"></sugar-popup>
		<sugar-tutorial ref="SugarTutorial"></sugar-tutorial>
	</div>

	<script src="js/components/SugarActivity.js"></script>
	<script src="js/components/SugarToolbar.js"></script>
	<script src="js/components/SugarL10n.js"></script>
	<script src="js/components/SugarPopup.js"></script>
	<script src="js/components/SugarTutorial.js"></script>
	<script src="js/foodchain.js"></script>
	<script src="js/components/FcParts.js"></script>
	<script src="js/components/FcHome.js"></script>
	<script src="js/components/FcLearn.js"></script>
	<script src="js/components/FcBuild.js"></script>
	<script src="js/components/FcPlay.js"></script>
	<script src="js/tutorial.js"></script>
	<script src="js/activity.js"></script>
</body>
</html>
