<!DOCTYPE html>
<html>
<head>
  <script src="lib/sugar-web/activity/toolbarmode.js"></script>
<meta charset="utf-8" />
<title>Clock Activity</title>
<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"/>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" media="not screen and (device-width: 1200px) and (device-height: 900px)"
	  href="lib/sugar-web/graphics/css/sugar-96dpi.css">
<link rel="stylesheet" media="screen and (device-width: 1200px) and (device-height: 900px)"
	  href="lib/sugar-web/graphics/css/sugar-200dpi.css">
    <link rel="stylesheet" href="../../css/sugar-redesign.css">
<link rel="stylesheet" href="css/activity.css">
<link rel="stylesheet" href="css/introjs.css">
<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
<script src="lib/intro.js"></script>
<script>if (window.module) module = window.module;</script>
<script data-main="js/loader" src="lib/require.js"></script>
<script type="text/javascript" src="../../cordova.js"></script>
</head>

<body>
  <div id="main-toolbar" class="toolbar">
    <button class="toolbutton" id="activity-button" title="My Activity" data-toolbar="advanced"></button>
    <button class="toolbutton" id="simple-clock-button" title="Simple Clock" data-toolbar="advanced"></button>
    <button class="toolbutton" id="nice-clock-button" title="Nice Clock" data-toolbar="advanced"></button>
    <hr data-toolbar="advanced"/>
    <button class="toolbutton" id="write-time-button" title="Write time" data-toolbar="advanced"></button>
    <button class="toolbutton" id="write-date-button" title="Write date" data-toolbar="advanced"></button>
    <button class="toolbutton active" id="write-seconds-button" title="Write seconds" data-toolbar="advanced"></button>
    <button class="toolbutton" id="show-am-pm" title="Show hours" data-toolbar="advanced"></button>
    <button class="toolbutton" id="show-mins" title="Show minutes" data-toolbar="advanced"></button>
		<hr data-toolbar="advanced"/>
		<button class="toolbutton" id="set-time-button" title="Set Time"></button>
    <button class="toolbutton" id="set-timeGame-button" title="Set Time to target"></button>
    <hr data-toolbar="advanced"/>
    <button class="toolbutton" id="global-time-button" title="Global Time" data-toolbar="advanced"></button>
    <button class="toolbutton pull-right" id="stop-button" title="Stop"></button>
    <button class="toolbutton pull-right" id="fullscreen-button" title="Fullscreen" data-toolbar="advanced"></button>
    <button class="toolbutton pull-right" id="help-button" title="Tutorial" data-toolbar="advanced"></button>
  </div>
  <div id="canvas">
    <div id="clock-container">
      <canvas id="clock-canvas"></canvas>
    </div>
    <div id="text-container">
      <p style="display: none" id="text-time">What Time Is It?</p>
      <p style="display: none" id="text-date">.</p>
    </div>
  </div>
	<button class="toolbutton pull-right" id="unfullscreen-button" title="Unfullscreen" data-toolbar="advanced"></button>
</body>
</html>
