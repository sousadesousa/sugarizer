<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Paint Activity</title>
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover" />
  <link rel="stylesheet" media="not screen and (device-width: 1200px) and (device-height: 900px)" href="lib/sugar-web/graphics/css/sugar-96dpi.css">
  <link rel="stylesheet" media="screen and (device-width: 1200px) and (device-height: 900px)" href="lib/sugar-web/graphics/css/sugar-200dpi.css">

  <link rel="stylesheet" href="css/activity.css">
  <link rel="stylesheet" href="css/libnotify.css">
  <link rel="stylesheet" href="css/introjs.css">
  <script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
  <script src="lib/vue.global.prod.js"></script>
  <script src="lib/intro.js"></script>
  <script>if (window.module) module = window.module;</script>
  <script src="lib/require.js"></script>
  <script type="text/javascript" src="../../cordova.js"></script>
</head>

<body>
  <div id="app">
    <sugar-toolbar ref="SugarToolbar">
      <sugar-toolitem id="activity-button" title="My Activity"></sugar-toolitem>
      <sugar-toolitem
        id="network-button"
        ref="networkItem"
        :title="t('network.title')"
        palette-file="sugar-web/graphics/presencepalette"
        palette-class="PresencePalette"
        palette-event="shared"
        @shared="onShared"
      ></sugar-toolitem>
      <sugar-toolitem
        id="colors-button-fill"
        :title="t('colorfill.title')"
        :style="{ backgroundColor: fillColor }"
        palette-file="js/palettes/colorpalette.js"
        palette-class="ColorPalette"
        palette-event="color-change"
        @color-change="fillColor = $event.detail.color"
      ></sugar-toolitem>
      <sugar-toolitem
        id="colors-button-stroke"
        :title="t('colorstroke.title')"
        :style="{ backgroundColor: strokeColor }"
        palette-file="js/palettes/colorpalette.js"
        palette-class="ColorPalette"
        palette-event="color-change"
        @color-change="strokeColor = $event.detail.color"
      ></sugar-toolitem>
      <sugar-toolitem id="undo-button" :title="t('undo.title')" :disabled="!canUndo" :style="{ opacity: canUndo ? 1 : 0.4 }" @click="undo"></sugar-toolitem>
      <sugar-toolitem id="redo-button" :title="t('redo.title')" :disabled="!canRedo" :style="{ opacity: canRedo ? 1 : 0.4 }" @click="redo"></sugar-toolitem>
      <sugar-toolitem id="size-button" :title="t('size.title')" :icon="'icons/size-' + (sizes.indexOf(size) + 1) + '.svg'" @click="nextSize"></sugar-toolitem>
      <sugar-toolitem id="pen-button" :title="t('pen.title')" :active="mode == 'Pen'" @click="setMode('Pen')"></sugar-toolitem>
      <sugar-toolitem id="eraser-button" :title="t('eraser.title')" :active="mode == 'Eraser'" @click="setMode('Eraser')"></sugar-toolitem>
      <sugar-toolitem
        id="stamps-button"
        :title="t('stamps.title')"
        :active="mode == 'Stamp'"
        palette-file="js/palettes/stamppalette.js"
        palette-class="StampPalette"
        palette-event="stamp-change"
        @stamp-change="stamp = $event.detail"
        @click="setMode('Stamp')"
      ></sugar-toolitem>
      <sugar-toolitem
        id="text-button"
        :title="t('text.title')"
        :active="mode == 'Text'"
        palette-file="js/palettes/textpalette.js"
        palette-class="TextPalette"
        palette-event="text-change"
        @text-change="text = $event.detail"
        @click="setMode('Text')"
      ></sugar-toolitem>
      <sugar-toolitem id="insertimage-button" :title="t('image.title')" @click="insertImage"></sugar-toolitem>
      <sugar-toolitem
        id="drawings-button"
        :title="t('drawing.title')"
        palette-file="js/palettes/drawingspalette.js"
        palette-class="DrawingsPalette"
        palette-event="drawing-selected"
        @drawing-selected="loadDrawing($event.detail.drawing)"
      ></sugar-toolitem>
      <sugar-toolitem id="bucket-button" :title="t('bucket.title')" :active="mode == 'Bucket'" @click="setMode('Bucket')"></sugar-toolitem>
      <sugar-toolitem
        id="filters-button"
        ref="filtersItem"
        :title="t('filters.title')"
        palette-file="js/palettes/filterspalette.js"
        palette-class="FiltersPalette"
        palette-event="filter-selected"
        @filter-selected="applyFilter($event.detail.filter)"
      ></sugar-toolitem>
      <sugar-toolitem id="copy-button" :title="t('copy.title')" :active="mode == 'Copy'" @click="setMode('Copy')"></sugar-toolitem>
      <sugar-toolitem id="paste-button" :title="t('paste.title')" :active="mode == 'Paste'" @click="setMode('Paste')"></sugar-toolitem>
      <sugar-toolitem id="save-image-button" :title="t('save.title')" @click="saveAsImage"></sugar-toolitem>
      <sugar-toolitem id="clear-button" :title="t('clear.title')" @click="clear"></sugar-toolitem>
      <sugar-toolitem id="stop-button" :title="t('stop.title')" class="pull-right" @click="onStop"></sugar-toolitem>
      <sugar-toolitem id="help-button" :title="t('help.title')" class="pull-right" @click="onHelp"></sugar-toolitem>
    </sugar-toolbar>

    <canvas
      id="paint-canvas"
      ref="canvas"
      @pointerdown="onPointerDown"
      @pointermove="onPointerMove"
      @pointerup="onPointerUp"
      @pointercancel="onPointerUp"
    ></canvas>

    <sugar-activity ref="SugarActivity" @initialized="onInitialized"></sugar-activity>
    <sugar-localization ref="SugarL10n"></sugar-localization>
    <sugar-popup ref="SugarPopup"></sugar-popup>
    <sugar-tutorial ref="SugarTutorial"></sugar-tutorial>
  </div>

  <script src="js/components/SugarActivity.js"></script>
  <script src="js/components/SugarToolbar.js"></script>
  <script src="js/components/SugarL10n.js"></script>
  <script src="js/components/SugarPopup.js"></script>
  <script src="js/components/SugarTutorial.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/collaboration.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/activity.js"></script>
</body>
</html>
