<!DOCTYPE html>
<html>

  <head>
    <script src="lib/sugar-web/activity/toolbarmode.js"></script>
    <meta charset="utf-8" />
    <title>Last One Loses Activity</title>
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"/>
	<link rel="stylesheet" media="not screen and (device-width: 1200px) and (device-height: 900px)"
	href="lib/sugar-web/graphics/css/sugar-96dpi.css">
	<link rel="stylesheet" media="screen and (device-width: 1200px) and (device-height: 900px)"
	href="lib/sugar-web/graphics/css/sugar-200dpi.css">
	<link rel="stylesheet" href="css/activity.css">
	<link rel="stylesheet" href="css/introjs.css">
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/libnotify.css">
	<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
	<script src="lib/vue.global.prod.js"></script>
	<script src="lib/intro.js"></script>
	<script>if (window.module) module = window.module;</script>
	<script src="lib/require.js"></script>
	<script type="text/javascript" src="../../cordova.js"></script><!-- HACK: need only on Android -->
  </head>

  <body>
    <div id="app">
      <sugar-toolbar ref="SugarToolbar">
        <sugar-toolitem id="activity-button" title="Last One Loses Activity" data-toolbar="advanced"></sugar-toolitem>
        <sugar-toolitem
          id="network-button"
          title="Network"
          palette-file="sugar-web/graphics/presencepalette"
          palette-class="PresencePalette"
          palette-event="shared"
          @shared="onShared"
          data-toolbar="advanced"
        ></sugar-toolitem>
        <sugar-toolitem splitbar></sugar-toolitem>
        <sugar-toolitem id="new-game-button" :title="onlyHost ? 'Only Host can do it' : 'New game'" :disabled="onlyHost" @click="doRenew"></sugar-toolitem>
        <sugar-toolitem splitbar></sugar-toolitem>
        <sugar-toolitem id="level-easy-button" :title="shared ? 'Not available in multiplayer' : 'Level easy'" :disabled="shared" :active="!shared && level == 1" @click="setLevel(1)" data-toolbar="advanced"></sugar-toolitem>
        <sugar-toolitem id="level-medium-button" :title="shared ? 'Not available in multiplayer' : 'Level medium'" :disabled="shared" :active="!shared && level == 2" @click="setLevel(2)" data-toolbar="advanced"></sugar-toolitem>
        <sugar-toolitem id="level-hard-button" :title="shared ? 'Not available in multiplayer' : 'Level hard'" :disabled="shared" :active="!shared && level == 3" @click="setLevel(3)" data-toolbar="advanced"></sugar-toolitem>
        <sugar-toolitem splitbar></sugar-toolitem>
        <sugar-toolitem id="switch-player-button" :title="onlyHost ? 'Only Host can do it' : 'Switch player'" :disabled="switchDisabled" @click="switchPlayer" data-toolbar="advanced"></sugar-toolitem>
        <sugar-toolitem id="stop-button" title="Stop" class="pull-right"></sugar-toolitem>
        <sugar-toolitem id="fullscreen-button" title="Fullscreen" class="pull-right" @click="setFullscreen(true)" data-toolbar="advanced"></sugar-toolitem>
        <sugar-toolitem id="help-button" title="Tutorial" class="pull-right" @click="onHelp" data-toolbar="advanced"></sugar-toolitem>
      </sugar-toolbar>

      <!-- The content of the activity goes inside the canvas -->
      <div id="canvas" :style="{top: state.fullscreen ? '0px' : ''}">
        <div id="lOLGameApp">
          <div class="playboard">
            <div id="lOLGameApp_player" ref="player" class="player-image" :class="{'empty-image': !myTurn}"></div>
            <div id="lOLGameApp_box" class="lol-box" :style="state.fullscreen ? {marginTop: '-30px', height: '90vh'} : {}">
              <lol-item v-for="(item, i) in selected" :key="i" :selected="item" @click="selectItem(i)"></lol-item>
            </div>
            <div id="lOLGameApp_computer" ref="computer" class="computer-image" :class="{'empty-image': !otherTurn, 'oponent-image': shared && opponent && otherTurn}"></div>
          </div>
          <img id="lOLGameApp_playbutton" class="play" src="icons/play.png" v-show="selectedCount > 0 && myTurn" @click="doPlay">
          <div id="lOLGameApp_endmessage" class="end-message" :class="endClass" v-show="ended"></div>
        </div>
      </div>
      <button class="toolbutton pull-right" id="unfullscreen-button" title="Unfullscreen" :style="{visibility: state.fullscreen ? 'visible' : 'hidden'}" @click="setFullscreen(false)" data-toolbar="advanced"></button>

      <sugar-activity ref="SugarActivity" @initialized="onInitialized"></sugar-activity>
      <sugar-localization ref="SugarL10n"></sugar-localization>
      <sugar-popup ref="SugarPopup"></sugar-popup>
      <sugar-tutorial ref="SugarTutorial"></sugar-tutorial>
    </div>

    <script src="js/components/SugarActivity.js"></script>
    <script src="js/components/SugarToolbar.js"></script>
    <script src="js/components/SugarL10n.js"></script>
    <script src="js/components/SugarPopup.js"></script>
    <script src="js/components/SugarTutorial.js"></script>
    <script src="js/lolgame.js"></script>
    <script src="js/components/LolItem.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/activity.js"></script>
  </body>

</html>
