<!DOCTYPE html>
<html>

  <head>
    <script src="lib/sugar-web/activity/toolbarmode.js"></script>
    <meta charset="utf-8" />
    <title>Grid Paint Activity</title>
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"/>
	<link rel="stylesheet" media="not screen and (device-width: 1200px) and (device-height: 900px)"
	href="lib/sugar-web/graphics/css/sugar-96dpi.css">
	<link rel="stylesheet" media="screen and (device-width: 1200px) and (device-height: 900px)"
	href="lib/sugar-web/graphics/css/sugar-200dpi.css">
    <link rel="stylesheet" href="css/activity.css">
    <link rel="stylesheet" href="./css/activity.css">
	<link rel="stylesheet" href="./css/introjs.css">
	<script src="./lib/intro.js"></script>
	<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
	<script>if (window.module) module = window.module;</script>
    <script data-main="js/loader" src="lib/require.js"></script>
	<script type="text/javascript" src="../../cordova.js"></script>
	<style type="text/css">@import "css/gridpaint.css";</style>
	<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
	<script type="text/javascript" src="js/debug.js"></script>
	<script type="text/javascript" src="js/events.js"></script>
	<script type="text/javascript" src="js/gridpaint.js"></script>
	<script type="text/javascript" src="js/thumbnails.js"></script>
	<script type="text/javascript" src="js/gallery.js"></script>
	<script type="text/javascript" src="js/shapedefs.js"></script>
    <script>if (window.module) module = window.module;</script>
  </head>

  <body style="overflow-x:hidden;">
    <div id="main-toolbar" class="toolbar">
      <button class="toolbutton" id="activity-button" data-toolbar="advanced" title="Grid Paint Activity"></button>
			<button class="toolbutton" id="clear-button" title="Clear" style="display: none;"></button>
      <button class="toolbutton pull-right" id="stop-button" title="Stop"></button>
      <button class="toolbutton pull-right" id="fullscreen-button" data-toolbar="advanced" title="Fullscreen"></button>
      <button class="toolbutton pull-right" id="help-button" data-toolbar="advanced" title="Tutorial"></button>
    </div>

    <!-- Clear confirmation dialog -->
    <div id="clear-dialog-overlay" class="clear-dialog-overlay" style="display: none;"></div>
    <div id="clear-dialog" class="clear-dialog" style="display: none;">
      <p id="clear-dialog-question"></p>
      <div class="clear-dialog-buttons">
        <button id="clear-dialog-cancel" class="clear-dialog-button cancel-button"></button>
        <button id="clear-dialog-confirm" class="clear-dialog-button confirm-button"></button>
      </div>
    </div>

    <!-- The content of the activity goes inside the canvas -->
	<div id="canvas">
		<div class="frame" id="frame">
		<canvas class="gridcnv" id="gridcnv"></canvas>
		<canvas class="gridcnv" id="hitbuffer"></canvas>
		<img src="icons/go-back-sel.png" id="back">
		<div class="thumbframe" id="thumbframe">
    </div>
    <button class="toolbutton pull-right" id="unfullscreen-button" data-toolbar="advanced" title="UnFullscreen"></button>
  </body>

</html>
