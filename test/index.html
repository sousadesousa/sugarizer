<html>
  <head>
    <meta charset="utf-8"/>
    <title>Sugarizer Tests</title>
    <link href="../node_modules/mocha/mocha.css" rel="stylesheet" />
  </head>
  <body>
  <div id="mocha"></div>

  <!-- mocha before require.js, or it registers as an AMD module instead of a global -->
  <script src="../node_modules/expect.js/index.js"></script>
  <script src="../node_modules/mocha/mocha.js"></script>
  <script src="../lib/require.js"></script>
  <script src="../lib/chai.js"></script>

  <script>mocha.setup('bdd')</script>
  <script src="datastore.js"></script>
  <script src="presence.js"></script>
  <script>
	// Init mocha
	mocha.checkLeaks();
	mocha.globals(['sugar*']);
	requirejs.config({ baseUrl: "../lib" });

	// Init Sugarizer settings
	var initSugarizer = function(updatedSettings) {
		window.localStorage.clear();
		var initSettings = {
			name: "Mocha",
			color: 163,
			colorvalue: { stroke: '#AC32FF', fill: '#FF8F00' }
		};
		if (updatedSettings) {
			for (var key in updatedSettings) {
				initSettings[key] = updatedSettings[key];
			}
		}
		window.localStorage.setItem("sugar_settings", JSON.stringify(initSettings));
	};

	// Init modules
	var datastore;
	var chai;
	var presence;
	initSugarizer();
	requirejs(["sugar-web/datastore", "chai", "sugar-web/presence"], function(d, c, p) {
		datastore = d;
		chai = c;
		presence = p;

		// Run tests, results are read by test/e2e/unit.spec.js
		var failed = [];
		mocha.run().on('fail', function(test, err) {
			failed.push(test.fullTitle() + ': ' + err.message);
		}).on('end', function() {
			window.mochaResults = {passes: this.stats.passes, failures: this.stats.failures, failed: failed};
		});
	});
  </script>
  </body>
</html>
